</style><main><header><strong>Control Reinforcement Learning</strong><a href="poster.pdf">Research poster ↗</a></header><nav class="section-nav" aria-label="Demonstration sections"><button data-section="method" class="active">Method</button><button data-section="learning">Learning</button><button data-section="experiment">Experiment</button><button data-section="results">Results</button></nav><div class="intro"><h1 id="title"></h1><p id="caption"></p></div><div class="scene"><aside class="transformer" id="transformer"></aside><section class="method"><div id="map" aria-label="Residual state branches into SAE encoding and actor selection; the selected decoder direction returns to the transformer."></div><div class="diagram" id="diagram" aria-live="polite"></div></section></div><div class="control"><nav class="tabs" id="tabs" aria-label="Inference steps"></nav><div class="buttons"><button id="restart">Restart</button><button id="back">Back</button><button id="next" class="primary">Next</button></div></div><footer id="note"></footer></main><script>

['Token generation','The forward pass reaches the layer where the controller intervenes.'],

['Steered output','The remaining layers use the modified state to predict the next token.'],

let stage=0,methodStage=0;const names=['Generate','Intercept','Select','Amplify','Resume'];const $=id=>document.getElementById(id);const vector=(v)=>'<div class="vector">'+v.map(x=>'<div class="value">'+x+'</div>').join('')+'</div>';const featureNames=['English','Greeting','French','Animal'];const colors=['#d58989','#8baed5','#91bb7e','#d5ba70'];function features(boost){return '<div class="features">'+featureNames.map((n,i)=>'<div class="feature '+(boost&&i===2?'boost':'')+'" style="--color:'+colors[i]+'"><strong>'+[4,5,boost?7:0,0][i].toFixed(1)+'</strong><span>'+n+'</span></div>').join('')+'</div>'}

names.forEach((name,i)=>{const b=document.createElement('button');b.textContent=name;b.onclick=()=>{stage=i;render()};$('tabs').append(b)});

function drawMap(){if(stage>=6){$('map').innerHTML='<div class="experiment-summary"><div class="study-label">REU 2026 · LEGALBENCH</div><h2>Learned Hands<br>issue spotting</h2><dl><dt>Base model</dt><dd>Gemma 2 2B · not instruction tuned</dd><dt>Intervention</dt><dd>Layer 20 · 16,384 SAE features</dd><dt>Controller</dt><dd>Actor–critic MLPs · PPO · top-1</dd><dt>Training</dt><dd>4,000 steps</dd></dl><div class="weight-note">Language-model weights remain fixed</div></div>';return}const labels=[
['Token generation','Embedding · transformer layers'],
['INTERVENTION LAYER','Capture residual x · forward hook'],

['CRL feature selection','Policy scores · top-k directions'],

['Resume generation','Remaining layers · next token']];

$('map').innerHTML='<div class="intercept-flow">'+labels.map(([title,sub],i)=>'<div class="flow-item '+(i===focus?'focus':'')+' '+(i===1?'intercept':'')+'"><strong>'+title+'</strong><span>'+sub+'</span></div>'+(i<5?'<div class="flow-link">'+(i===1?'branch into controller':i===4?'return modified state':'↓')+'</div>':'')).join('')+'</div><div class="weight-note">Language-model weights remain fixed</div>';
}
function render(){ $('title').textContent=steps[stage][0];$('caption').textContent=steps[stage][1];$('transformer').innerHTML='<div class="small">TRANSFORMER FORWARD PASS</div><div class="box">Token: “Hello”</div><div class="arrow">↓</div><div class="box">Embedding</div><div class="arrow">↓</div><div class="box '+(stage===0?'active':'')+'">Attention + residual</div><div class="arrow">↓</div><div class="box '+(stage>0?'hook':'active')+'">MLP + residual<br><span class="small">Hooked activation x</span></div><div class="arrow">↓</div><div class="box">Remaining layers<br>Unembedding · logits</div>';const views=[
'<div class="operation">Input token: “Hello”</div><div class="operation">Embedding → attention / MLP updates → intervention layer</div><div class="connector">Generation pauses at the hooked layer.</div>',
'<div class="row"><span class="name">Residual x</span>'+vector(['1.0','5.2','−3.1','…','−1.2'])+'</div><div class="encoder-block"><span class="encoder-label">Residual x</span><span class="encoder-arrow" aria-hidden="true">→</span><strong>SAE encoder</strong><span class="encoder-arrow" aria-hidden="true">→</span><span class="encoder-label">Feature activations</span></div><div class="row"><span class="name">Activations</span>'+features(false)+'</div><div class="connector">Active features describe the state at this token position.</div>',
'<div class="operation equation">μ = π<sub>θ</sub>(x)<br>a = TopK(μ, k)</div><div class="row"><span class="name">Feature directions</span>'+features(false)+'</div><div class="connector">The mask restricts selection to active features. During training, the actor samples an action; during evaluation, it selects the highest-scoring action.</div>',
'<div class="row"><span class="name">Feature weights</span>'+features(true)+'</div><div class="operation equation">x̃ = x + c · a Wdec</div><div class="connector">Here, the French feature receives an additional weight of 7. The LegalBench experiment uses c = 50.</div>',
'<div class="small">Without steering</div>'+output(['Hello','how','are','you?'])+'<div class="small">French feature amplified</div>'+output(['Bonjour','comment','allez-vous?'])+'<div class="connector">Steering changes the residual stream, while the language-model weights remain fixed.</div>',
'<div class="training"><div class="box"><strong>Task reward</strong><p>LegalBench answer correctness<br>Correct: +1 · Incorrect: 0</p></div><div class="box"><strong>Controller training</strong><p>Actor selects directions<br>Critic estimates reward<br>PPO updates controller weights</p></div></div><div class="operation">Record selected features and model answers.</div><div class="connector">The reward measures task success. Feature logs show which directions the policy selects, but their labels alone do not explain the output.</div>',
'<div class="training"><div class="box"><strong>Data and task</strong><p>Learned Hands test data shuffled into train, validation, and test partitions. Answers are Yes or No.</p></div><div class="box"><strong>Training objective</strong><p>Correct: +1<br>Incorrect: 0, or −10 in reward variants<br>PPO clip ε = 0.2</p></div></div><div class="operation">Variants: reward penalty, lower learning rate, and entropy regularization.</div><div class="connector">Learning rates: 5 × 10⁻⁵ and 5 × 10⁻⁶. The notebook includes the lower-rate run with entropy regularization.</div>',
'<div class="results-wrap"><table><caption>Comparison of CRL variants</caption><thead><tr><th>Variant</th><th>Mean score (%)</th><th>Feature diversity</th></tr></thead><tbody><tr><td>Baseline</td><td>48.33 ± 1.77</td><td>—</td></tr><tr><td>Initial</td><td>51.67 ± 0.72</td><td>3.66 ± 0.94</td></tr><tr><td>Incorrect reward −10</td><td>51.45 ± 1.49</td><td>7.00 ± 0.82</td></tr><tr><td>Learning rate 5 × 10⁻⁶</td><td>51.78 ± 0.63</td><td>16.33 ± 1.70</td></tr><tr><td>Lower rate + reward −10</td><td>50.33 ± 1.51</td><td>26.67 ± 0.94</td></tr><tr><td>Lower rate + entropy</td><td>50.89 ± 1.64</td><td>12.66 ± 0.94</td></tr></tbody></table></div><div class="connector">Reward, learning rate, and entropy changes affected feature-selection diversity. The lower-rate penalty run had the highest diversity in this comparison.</div>'
];const d=$('diagram');d.innerHTML=views[stage];d.classList.remove('fade');void d.offsetWidth;d.classList.add('fade');drawMap();[...$('tabs').children].forEach((b,i)=>{b.classList.toggle('active',i===stage);b.setAttribute('aria-current',i===stage?'step':'false')});$('back').disabled=stage===0;$('next').disabled=stage===4;document.querySelector('.control').hidden=stage>=5;document.querySelectorAll('[data-section]').forEach(b=>b.classList.toggle('active',b.dataset.section===(stage<5?'method':stage===5?'learning':stage===6?'experiment':'results')));$('note').textContent=stage>=6?'Results reported in the final REU poster.':stage<5?'Conceptual example from the poster. Values and output text illustrate steering; this is not a live model run.':'Implementation: CRL_Demo.ipynb. The active-feature mask resets on each pass.'}
